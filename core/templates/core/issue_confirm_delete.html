{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Issue{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-danger text-white rounded-top-4">
                    <h4 class="mb-0"><i class="fas fa-exclamation-triangle"></i> Confirm Delete</h4>
                </div>
                <div class="card-body p-4 text-center">
                    <p class="fs-5">Are you sure you want to delete this issue?</p>
                    <div class="alert alert-secondary">
                        <strong>{{ contact.name }}</strong> - {{ contact.department }}
                        <br>
                        <small>{{ contact.message|truncatechars:100 }}</small>
                    </div>
                    
                    <div class="d-flex justify-content-center gap-3 mt-4">
                        <a href="{% url 'core:issue_detail' contact.id %}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                        <form method="POST" action="{% url 'core:issue_delete' contact.id %}">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
