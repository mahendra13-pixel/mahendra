{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Issue — {{ contact.department }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-warning text-dark fw-bold fs-5 rounded-top-4">
                    <i class="fas fa-edit"></i> Edit Issue — {{ contact.department }}
                </div>

                <div class="card-body p-4">

                    {% if messages %}
                    {% for message in messages %}
                    <div class="alert alert-primary" role="alert">
                        {{ message }}
                    </div>
                    {% endfor %}
                    {% endif %}

                    <form method="POST" action="{% url 'core:issue_edit' contact.id %}">
                        {% csrf_token %}

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="name" class="form-label">Full Name</label>
                                <input type="text" id="name" name="name" class="form-control"
                                    value="{{ contact.name }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="department" class="form-label">Department</label>
                                <input type="text" id="department" name="department" class="form-control"
                                    value="{{ contact.department }}">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="phone" class="form-label">Extension Number</label>
                                <input type="text" id="phone" name="phone" class="form-control"
                                    value="{{ contact.phone }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="ip_address" class="form-label">IP Address</label>
                                <input type="text" id="ip_address" name="ip_address" class="form-control"
                                    value="{{ contact.ip_address|default:'' }}">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="priority" class="form-label">Priority</label>
                                <select id="priority" name="priority" class="form-select">
                                    <option value="Low" {% if contact.priority == 'Low' %}selected{% endif %}>Low</option>
                                    <option value="Medium" {% if contact.priority == 'Medium' %}selected{% endif %}>Medium</option>
                                    <option value="High" {% if contact.priority == 'High' %}selected{% endif %}>High</option>
                                    <option value="Critical" {% if contact.priority == 'Critical' %}selected{% endif %}>Critical</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="status" class="form-label">Status</label>
                                <select id="status" name="status" class="form-select">
                                    <option value="Pending" {% if contact.status == 'Pending' %}selected{% endif %}>Pending</option>
                                    <option value="In Progress" {% if contact.status == 'In Progress' %}selected{% endif %}>In Progress</option>
                                    <option value="Resolved" {% if contact.status == 'Resolved' %}selected{% endif %}>Resolved</option>
                                    <option value="Closed" {% if contact.status == 'Closed' %}selected{% endif %}>Closed</option>
                                </select>
                            </div>
                        </div>

                        <!-- Admin Only Fields with Dropdowns -->
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="call_attended_by" class="form-label">Call Attended By</label>
                                <select id="call_attended_by" name="call_attended_by" class="form-select">
                                    <option value="">Select Staff</option>
                                    <option value="Mahendra Kunwar" {% if contact.call_attended_by == 'Mahendra Kunwar' %}selected{% endif %}>Mahendra Kunwar</option>
                                    <option value="Ram Kumar Badal" {% if contact.call_attended_by == 'Ram Kumar Badal' %}selected{% endif %}>Ram Kumar Badal</option>
                                    <option value="Binaya Kunwar" {% if contact.call_attended_by == 'Binaya Kunwar' %}selected{% endif %}>Binaya Kunwar</option>
                                    <option value="Subash Dahal" {% if contact.call_attended_by == 'Subash Dahal' %}selected{% endif %}>Subash Dahal</option>
                                    <option value="Ashish Adhikari" {% if contact.call_attended_by == 'Ashish Adhikari' %}selected{% endif %}>Ashish Adhikari</option>
                                </select>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label for="handover_to" class="form-label">Handover To</label>
                                <select id="handover_to" name="handover_to" class="form-select">
                                    <option value="">Select Staff</option>
                                    <option value="Mahendra Kunwar" {% if contact.handover_to == 'Mahendra Kunwar' %}selected{% endif %}>Mahendra Kunwar</option>
                                    <option value="Ram Kumar Badal" {% if contact.handover_to == 'Ram Kumar Badal' %}selected{% endif %}>Ram Kumar Badal</option>
                                    <option value="Binaya Kunwar" {% if contact.handover_to == 'Binaya Kunwar' %}selected{% endif %}>Binaya Kunwar</option>
                                    <option value="Subash Dahal" {% if contact.handover_to == 'Subash Dahal' %}selected{% endif %}>Subash Dahal</option>
                                    <option value="Ashish Adhikari" {% if contact.handover_to == 'Ashish Adhikari' %}selected{% endif %}>Ashish Adhikari</option>
                                </select>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label for="solved_by" class="form-label">Solved By</label>
                                <select id="solved_by" name="solved_by" class="form-select">
                                    <option value="">Select Staff</option>
                                    <option value="Mahendra Kunwar" {% if contact.solved_by == 'Mahendra Kunwar' %}selected{% endif %}>Mahendra Kunwar</option>
                                    <option value="Ram Kumar Badal" {% if contact.solved_by == 'Ram Kumar Badal' %}selected{% endif %}>Ram Kumar Badal</option>
                                    <option value="Binaya Kunwar" {% if contact.solved_by == 'Binaya Kunwar' %}selected{% endif %}>Binaya Kunwar</option>
                                    <option value="Subash Dahal" {% if contact.solved_by == 'Subash Dahal' %}selected{% endif %}>Subash Dahal</option>
                                    <option value="Ashish Adhikari" {% if contact.solved_by == 'Ashish Adhikari' %}selected{% endif %}>Ashish Adhikari</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="message" class="form-label">Issue or Message</label>
                            <textarea id="message" name="message" rows="4"
                                class="form-control">{{ contact.message }}</textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'core:issue_detail' contact.id %}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Save Changes
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
