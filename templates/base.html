<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PEACEFUL BOYS HOSTEL{% endblock %}</title>
    <!-- bootstrap css link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- inttelphone link -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@27.0.0/dist/css/intlTelInput.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/contact.css' %}">
    <link rel="icon" href="{% static 'images/favicon/favicon.ico' %}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Header (thin bar, admin link only) -->
    <header class="site-header">
        <div class="container">
            <div class="header-inner">
                <a href="{% url 'admin:index' %}" class="admin-icon-link" title="Admin Panel">
                    <i class="fas fa-gear"></i>
                </a>
            </div>
        </div>
    </header>
    
    <!-- Main Content -->
    {% block content %}
    {% endblock content %}
    
    <!-- Custom JavaScript -->
    <script src="{% static 'js/base.js' %}"></script>
    <script src="{% static 'js/contact.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@27.0.0/dist/js/intlTelInput.min.js"></script>
    <script src="{% static 'js/scripts.js' %}"></script>
    <!-- bootstrap js link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
