<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PEACEFUL BOYS HOSTEL{% endblock %}</title>
    <!-- bootstrap css link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- inttelphone link -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@27.0.0/dist/css/intlTelInput.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/contact.css' %}">
    <link rel="icon" href="{% static 'images/favicon/favicon.ico' %}">

    <style>
        /* Header layout */
        .site-header {
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            padding: 1px 0;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0px 0;
        }

        /* LEFT CORNER - Icons (Compact) */
        .header-left-icons {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .header-left-icons .icon-link {
            color: #6b7280;
            text-decoration: none;
            padding: 1px 4px;
            border-radius: 4px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 0.75rem;
            line-height: 1;
        }

        .header-left-icons .icon-link:hover {
            background: rgba(0, 0, 0, 0.06);
            transform: translateY(-1px);
        }

        .header-left-icons .icon-link.hospital:hover {
            color: #3b82f6;
        }

        .header-left-icons .icon-link.email:hover {
            color: #dc2626;
        }

        .header-left-icons .icon-link.whatsapp:hover {
            color: #25D366;
        }

        .header-left-icons .icon-link .brand-text {
            font-size: 0.65rem;
            font-weight: 600;
            color: #1f2937;
        }

        .header-left-icons .icon-link i {
            font-size: 0.85rem;
        }

        .header-left-icons .divider {
            color: #d1d5db;
            font-size: 0.8rem;
            margin: 0 1px;
        }

        /* RIGHT CORNER - Admin Link (Compact) */
        .admin-icon-link {
            color: #6b7280;
            text-decoration: none;
            padding: 3px 6px;
            border-radius: 4px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            font-size: 0.85rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .admin-icon-link:hover {
            background: rgba(0, 0, 0, 0.06);
            color: #374151;
            transform: rotate(90deg);
        }

        /* CENTER - Empty space for form (form stays centered) */
        .header-center {
            flex: 1;
        }

        /* Responsive */
        @media (max-width: 576px) {
            .header-left-icons .icon-link .brand-text {
                display: none;
            }

            .header-left-icons .divider {
                display: none;
            }

            .header-left-icons .icon-link {
                padding: 2px 4px;
                font-size: 0.7rem;
            }

            .header-left-icons .icon-link i {
                font-size: 0.75rem;
            }

            .admin-icon-link {
                padding: 2px 4px;
                font-size: 0.75rem;
            }

            .site-header {
                padding: 2px 0;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>
    <!-- Header (thin bar) -->
    <header class="site-header">
        <div class="container">
            <div class="header-inner">
                <a href="http://192.168.0.63:7000/#/login?_k=4z3xlh" target="_blank" rel="noopener noreferrer"
                    class="icon-link" title="Open System Login">
                    qms
                </a>
                <!-- LEFT CORNER - Icons (Yellow marked area) -->
                <div class="header-left-icons">
                    <a href="http://192.168.0.48:8010/login?logout=success" target="_blank" rel="noopener noreferrer"
                        class="icon-link" title="Open Link">
                        pacs
                    </a>
                    <!-- TEST System Icon -->
                    <a href="http://192.168.0.56/TEST/Forms/fm_Login.aspx" target="_blank" rel="noopener noreferrer"
                        class="icon-link test" title="TEST System">
                        uat
                    </a>
                    <!-- Peaceful Boys Hostel Icon -->
                    <a href="https://hims.grandehospital.com/SHIMS/forms/fm_login.aspx" class="icon-link hospital"
                        title="SHIMS - Hospital Management System" target="_blank" rel="noopener noreferrer">
                        <i class="fas fa-hospital"></i>
                        <span class="brand-text">SHIMS</span>
                    </a>
                    <span class="divider">|</span>

                    <!-- Email Icon -->
                    <a href="https://mail.grandehospital.com/?_task=mail&_action=compose&_to=itteam@grandehospital.com"
                        target="_blank">
                        <i class="fas fa-envelope"></i>
                    </a>

                    <!-- WhatsApp Icon -->
                    <a href="https://wa.me/9779742386629" target="_blank" class="icon-link whatsapp"
                        title="Chat on WhatsApp">
                        <i class="fab fa-whatsapp"></i>
                    </a>

                    <a href="https://docs.google.com/spreadsheets/d/1KRJYsfzWz8l4UYMevSEV39_FvLWStXavZw_UGkyukyo/edit?gid=0#gid=0"
                        target="_blank" rel="noopener noreferrer" class="icon-link sheets"
                        title="Open Google Sheets - IT Team">
                        <i class="fas fa-table"></i>
                    </a>
                    <!-- Wevin Site Link -->
                    <a href="http://192.168.10.150:19850/wevinsite/" target="_blank" rel="noopener noreferrer"
                        class="icon-link" title="Open Wevin Site">
                        W-EV
                    </a>
                    <!-- AI Tools - Claude -->
                    <a href="https://claude.ai" target="_blank" rel="noopener noreferrer" class="icon-link"
                        title="Claude AI">
                        <i class="fas fa-feather"></i>
                    </a>
                    <!-- AI Tools - ChatGPT -->
                    <a href="https://chat.openai.com" target="_blank" rel="noopener noreferrer" class="icon-link"
                        title="ChatGPT">
                        <i class="fas fa-robot"></i>
                    </a>
                    <!-- AI Tools - Gemini -->
                    <a href="https://gemini.google.com" target="_blank" rel="noopener noreferrer" class="icon-link"
                        title="Gemini AI">
                        <i class="fas fa-gem"></i>
                    </a>
                    <!-- AI Tools - DeepSeek -->
                    <a href="https://chat.deepseek.com" target="_blank" rel="noopener noreferrer" class="icon-link"
                        title="DeepSeek">
                        <i class="fas fa-microchip"></i>
                    </a>
                    <a href="https://free-screen-recorder.vercel.app/" target="_blank" rel="noopener noreferrer"
                        class="icon-link recorder" title="Open Screen Recorder - No installation needed">
                        <i class="fas fa-video"></i>
                        <span class="brand-text">Record</span>
                    </a>
                    <!-- 🎥 Record (record.addy.ie) -->
                    <a href="https://record.addy.ie" target="_blank" rel="noopener noreferrer"
                        class="icon-link recorder" title="Open Record - Screen Recorder">
                        <i class="fas fa-record-vinyl"></i>
                        <span class="brand-text">Record</span>
                    </a>
                    <a href="https://videotrimmer.com/?_t=1787129731337" target="_blank" rel="noopener noreferrer"
                        class="icon-link trimmer" title="Open Video Trimmer - Cut Videos">
                        <i class="fas fa-cut"></i>
                        <span class="brand-text">Trim</span>
                    </a>
                    <a href="https://www.image2url.com/en-AU/tools/screenshot-to-url" target="_blank"
                        rel="noopener noreferrer" class="icon-link" title="Take Screenshot - Capture & Share">
                        <i class="fas fa-camera"></i>
                    </a>
                    <!-- Super Small Inventory Text Link -->
                    <a href="{% url 'inventory:management' %}" class="icon-link" title="Inventory"
                        style="font-size: 0.5rem; padding: 0.05rem 0.15rem !important; text-decoration: none; color: inherit; display: inline-block; line-height: 0.8; font-weight: 400; letter-spacing: 0.3px;">
                        INVENTORY
                    </a>
                    <!-- Contact Page Link (Django) -->
                    <a href="/contact/" class="icon-link" title="Contact Page">
                        <i class="fas fa-address-card"></i>
                        <span class="brand-text">HOME</span>
                    </a>

                    <!-- In header-left-icons -->
                    <span class="divider">|</span>

                    <!-- Notification Widget -->
                    {% include 'notifications/widget.html' %}
                </div>

                <!-- CENTER - Empty space (form stays centered) -->
                <div class="header-center"></div>

                <!-- RIGHT CORNER - Admin Link -->
                <a href="{% url 'admin:index' %}" class="admin-icon-link" title="Admin Panel">
                    <i class="fas fa-gear"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    {% block content %}
    {% endblock content %}

    <!-- Custom JavaScript -->
    <script src="{% static 'js/base.js' %}"></script>
    <script src="{% static 'js/contact.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@27.0.0/dist/js/intlTelInput.min.js"></script>
    <script src="{% static 'js/scripts.js' %}"></script>
    <!-- bootstrap js link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    {% block extra_js %}{% endblock %}
</body>

</html>
