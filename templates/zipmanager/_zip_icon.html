{% load static %}

<button type="button"
        class="zip-icon-btn"
        data-zip-url="{% url 'zipmanager:upload_zip' %}"
        data-download-url="{% url 'zipmanager:download_all' %}"
        data-csrf="{{ csrf_token }}"
        data-source="{{ source|default:'store' }}"
        data-source-id="{{ source_id|default:'' }}"
        title="Upload folder as ZIP (admin only, max 1 GB)">
  <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
    <path fill="currentColor"
      d="M4 4h10l2 2h4v14H4V4zm2 2v12h12V8h-4l-2-2H6zm5 1h2v2h-2V7zm0 3h2v2h-2v-2zm0 3h2v2h-2v-2zm0 3h2v2h-2v-2z"/>
  </svg>
  <span class="zip-progress" hidden>0%</span>
  <input type="file" class="zip-folder-input" webkitdirectory directory multiple hidden>
</button>

<style>
.zip-icon-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px;
  background: #f8f8f8; cursor: pointer; vertical-align: middle;
  position: relative; font: inherit;
}
.zip-icon-btn:hover:not(:disabled) { background: #eef; border-color: #99f; }
.zip-icon-btn:disabled { opacity: .55; cursor: not-allowed; }
.zip-icon-btn .zip-progress {
  font-size: 11px; color: #2563eb;
  min-width: 28px; text-align: center; font-weight: 600;
}
.zip-icon-btn.is-success .zip-progress { color: #16a34a; }
.zip-icon-btn.is-error   .zip-progress { color: #dc2626; }
</style>
